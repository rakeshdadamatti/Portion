<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portion AI — semantic resume search and an interactive AI screening copilot for recruiting teams."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Portion AI — Resume Search &amp; Interactive Screening</title>
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var stored = localStorage.getItem('portion.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersLight ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
